# =============================================================================
#  MD protocol — M2 peptide variants x C4BPalpha1-2, 2:2 assembly
#  10 replicates x 60 ns production
# =============================================================================
#  This file is shared verbatim by the S-15 (standard) and S-16 (non-standard)
#  config sets. Keep the two copies identical.
#
#  Top level must be a single `simulation:` mapping — validate_config indexes
#  config["simulation"] directly (helper_functions.py:183).
#
#  validate_config only checks replicates / time_ns / number_frames. Every other
#  key below is read with a bare [] in run_md.py and will KeyError at job start
#  if removed — the validator passing is NOT proof this file is complete.
# -----------------------------------------------------------------------------

simulation:

  # --- production length and frame bookkeeping -------------------------------
  # Nothing here is derived; all four knobs are independent and must stay
  # consistent by hand:
  #   total_steps  = time_ns * 1e6 / dt_fs                 (run_md.py:372)
  #   recordInterval = recording_interval_ps * 1000 / dt_fs (run_md.py:369)
  #   raw frames   = time_ns * 1000 / recording_interval_ps
  #   DCD frames   = raw frames / analysis_stride           (center_trajectory.py:73)
  #   analysed     = LAST number_frames of the DCD          (posco:253)
  #
  #   60 * 1e6 / 2        = 30,000,000 steps
  #   60 * 1000 / 50      = 1,200 raw frames
  #   1,200 / 2           = 600 DCD frames, 100 ps apart
  #   last 200 of 600     = final 20 ns analysed
  # Requirement number_frames <= DCD frames: 200 <= 600. OK.

  replicates: 10              # owned by md_config; sim_config has no replicate field
  time_ns: 60                 # matches the sibling C4BP project's 60 ns convention
  recording_interval_ps: 50
  analysis_stride: 2
  number_frames: 200

  seed: 2007
  # MASTER seed only. Snakefile:56-58 does
  #   np.random.seed(seed); seeds = np.random.randint(100, 1000, size=replicates)
  # so the per-replicate seeds are DERIVED, not listed. The sibling project's
  # explicit 2007..2016 convention cannot be reproduced here — only this value.
  # 10 draws from 900 values collide with ~4.8% probability, which would silently
  # yield fewer than 10 replicate directories. Check before a long run:
  #   python -c "import numpy as np; np.random.seed(2007); \
  #              s=np.random.randint(100,1000,10); print(sorted(s), len(set(s)))"

  # --- equilibration ---------------------------------------------------------
  # Production values. The S-1-C4B template shipped 10/10/10 (a smoke test) with
  # these numbers in its trailing comments; they are restored here.
  equilibration:
    protein_k: 10             # harmonic restraint on protein during equilibration
    NVT_heating: 5000         # steps per heating step (50 K -> production T)
    NPT_equilibration: 50000  # steps per restrained NPT stage (2 stages)
    NPT_unrestrained: 100000  # steps of unrestrained NPT before production

  forcefield:
    protein: amber19-all.xml         # options: amber14-all.xml, amber19-all.xml
    water:   amber19/tip4pew.xml     # options: amber14/tip3p.xml, amber19/tip3pfb.xml
    watermodel: tip4pew
    # NOTE: run_md.py:169-173 reads exactly these two scalars and splats them into
    # app.ForceField(protein, water). There is no key for additional XML files —
    # adding one is the prerequisite for parameterising AIB / 4FF / 3ClY (S-16).

  system:
    salt_molar: 0.15           # M NaCl
    temperature_K: 300         # Kelvin
    pressure_atm: 1
    barostat_interval_steps: 25
    ph: 7.4
    # addHydrogens only ADDS missing hydrogens, so PrepWizard's PROPKA pH-7.4
    # protonation and His tautomers survive from pdb_md/ into the MD.

  constraints:
    dt_fs: 2
    bonds: HBonds         # options: None, HBonds, AllBonds
    rigid_water: True
    cutoff_nm: 1.0
    ewald_error_tolerance: 0.0005
    constraint_tolerance: 0.0001
    friction_ps: 1.0

  # Unused by protein_protein; carried over from the template so the file stays
  # a drop-in for the metadynamics_* modes.
  metadynamics:
    SIGMA_COM: 0.08
    SIGMA_CONTACTS: 8
    CONTACT_R0: 0.45
    CONTACT_NN: 6
    CONTACT_ATOM_MODE: ca # options: ca, heavy, backbone, all
    CONTACT_MAX_ATOMS_PER_PARTNER: 120
    HEIGHT: 0.08
    PACE: 3000
    STRIDE: 200
