[project]
name = "squeezemd"
version = "1.9.0"
description = "SqueezeMD is an automated molecular dynamics workflow with extensive post-analysis for protein interactions"
readme = "README.md"
authors = [
  {name = "Rüthemann Peter", email = "peter.ruethemann@gmail.com"}
]
maintainers = [
  {name = "peter", email = "peter.ruethemann@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
license = {text = "MIT"}
# Only the lightweight, pip-installable runtime core is pinned here. The heavy
# native/scientific stack (openmm, openmm-plumed, openmmforcefields, openff-toolkit,
# mdanalysis, mdtraj, prolif, snakemake, pymol-open-source) plus the external FoldX
# and PoSCo binaries are provided by the conda environment, which is the source of
# truth for reproducible installs: see install/environment.yml and install/INSTALL.md.
dependencies = [
  "typer",
  "pyyaml",
  "numpy",
  "pandas",
  "pyarrow",
]
requires-python = ">= 3.12"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/pruethemann/squeezemd"
changelog = "https://github.com/pruethemann/squeezemd/blob/master/HISTORY.rst"
homepage = "https://github.com/pruethemann/squeezemd"

[project.scripts]
squeezemd = "squeezemd.cli:app"

# preprocessing
mutate = "squeezemd.preprocessing.mutate_structure:main"

#md
center-traj = "squeezemd.md.center_trajectory:main"
run-md = "squeezemd.md.run_md:main"

# show status of performed MDs
show-md = "squeezemd.preprocessing.show_overview:main"

# Analysis - Posco
compute-posco-contacts = "squeezemd.analysis.contact_posco.compute_posco_interactions:main"
plot-contact-barplot = "squeezemd.analysis.contact_posco.plot_contact_barplot:main"
plot-contact-heatmap = "squeezemd.analysis.contact_posco.plot_contact_heatmap:main"

# Analysis Prolif
compute-prolif-fingerprints = "squeezemd.analysis.contact_prolif.compute_prolif_fingerprints:main"
analyze-prolif-fingerprints = "squeezemd.analysis.contact_prolif.analyze_prolif_fingerprints:main"

# Analysis Trajectory
analyze-potential-energy = "squeezemd.analysis.trajectory.analyze_potential_energy:main"
explore-trajectory = "squeezemd.analysis.trajectory.explore_trajectory:main"
compute-rmsf = "squeezemd.analysis.trajectory.compute_rmsf:main"
plot-rmsf = "squeezemd.analysis.trajectory.plot_rmsf:main"

# Visualization
#visualize-aligned-structures = "squeezemd.analysis.visualization.align_structures:main"
visualize-interaction-surface = "squeezemd.analysis.visualization.visualize_interaction_surface:main"

# Analysis metadynamics
analyze-collective-vars = "squeezemd.analysis.metadynamics.analyze_collective_vars:main"
analyze-metadynamics-hills = "squeezemd.analysis.metadynamics.analyze_metadynamics_hills:main"
analyze-metadynamics-convergence = "squeezemd.analysis.metadynamics.analyze_metadynamics_convergence:main"


[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
squeezemd = ["resources/*.yaml","md/*.py", "Snakefile", "resources/pymol_template.pml", "resources/*.rst"]

[tool.setuptools.data-files]
"bin" = ["scripts/squeeze",
        "src/squeezemd/analysis/visualization/visualize_aligned_structures.py"]

