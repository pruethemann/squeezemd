# This environment install everything required to run squeezeMD
# posco and foldX is installed via the script install_bins_linux.sh

# How to install via conda:
# conda env create -f environment_full_V2.yml

name: squeeze3

channels:
  - conda-forge
  - bioconda                # for snakemake
  - nvidia

dependencies:
  - python                  # 09-25: Python 13 not supported yet
  - openmm>=8.4
  - openmm-plumed
  - openmmforcefields       #   
  - openff-toolkit>=0.18          # small molecule forcefield
  - snakemake-minimal       # Automatic workflow engine
  - prolif                  # Interaction fingerprint
  - pandas                  # Data science
  - pyarrow                 # Data handling
  - mdtraj                  # For centering protein in water box
  - cuda-toolkit==12.9      # Cudatoolkit. 09-25: Version 12.9 (V 13 is not supported yet by Openmm)
  - seaborn                 # visualisation
  - plotly                  # For trajectory analysis (will be depracted soon)
  - pymol-open-source       # Open source version of pymol (conda-forge)
  - pip
  - pip:
        - json2html         # Html report
        - squeezemd         # The published squeezemd code
        - h5py
        - build             # only DEV: builds tar for pypi
        - twine             # uploads to pypi
